[package]
name = "audiolib-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["playback"]
# Audio output (device I/O + audition time-stretch). Headless users (the server) opt out.
playback = ["dep:cpal", "dep:soundtouch"]
asio = ["playback", "cpal/asio", "audiolib-windows/asio"]

[[example]]
name = "audio-smoke"
required-features = ["playback"]

[[example]]
name = "seek-loopback"
required-features = ["playback"]

[[example]]
name = "first-sound-loopback"
required-features = ["playback"]

[dependencies]
audiolib-core = { path = "../audiolib-core" }
audiolib-windows = { path = "../audiolib-windows" }
cpal = { workspace = true, optional = true }
symphonia.workspace = true
rubato.workspace = true
serde.workspace = true
serde_json.workspace = true
rustfft = "6.4"
audioadapter-buffers = "5.2"
soundtouch = { version = "=0.5.4", features = ["bundled"], optional = true }
roxmltree = "=0.21.1"
encoding_rs = "0.8.35"
blowfish = "=0.9.1"
base64 = "=0.23.1"

[dev-dependencies]
tempfile.workspace = true

