# server/audiolib-server/config.example.toml
# Example configuration for audiolib-server. Copy it outside the repository and adjust it.
# Typical locations: /etc/audiolib/config.toml (Linux), /usr/local/var/audiolib/config.toml
# (macOS), or the recommended %ProgramData%\AudioLibServer\config.toml (Windows).
# The server requires --config or AUDIOLIB_SERVER_CONFIG; it does not discover this path.
# All values below are documentation placeholders (192.0.2.0/24, example.com).
# Start with:  audiolib-server --config /path/to/server.toml
# (optional env token:  AUDIOLIB_SERVER_TOKEN='<secret>' audiolib-server --config ...)
# (AUDIOLIB_SERVER_CONFIG=/path/to/server.toml may replace --config).
# Relative paths below resolve against the directory containing this file.

# Listen address (default "0.0.0.0:8790": all interfaces, LAN access).
bind = "0.0.0.0:8790"

# Existing AudioLib library (supported older formats are migrated on open; current schema 8). The server never creates a library: create or
# import one first, e.g. `AudioLibCli db create <path>`. A sidecar
# `<library_db>.server-state.json` (library_id + revision) is written next to it.
library_db = "/var/lib/audiolib/library.db"
# Windows: replace with an existing library, e.g. library_db = 'C:\ProgramData\AudioLibServer\library.db'.
# Also replace every [[roots]].server_path below with a real Windows audio directory.

# Legacy switch: auth = true is the same as auth_mode = "all" and makes the environment
# token mandatory at startup. Leave it false and use auth_mode instead.
auth = false

# Authentication mode (doc/api/README.md §2.2; the LAN-only admin page at
# http://<host>:8790/admin can override it):
#   "off"      - no endpoint needs a token
#   "external" - default: LAN-direct requests need no token (Authorization is ignored);
#                requests through a reverse proxy (X-Forwarded-For, Forwarded, X-Real-IP,
#                X-Forwarded-Proto/Host) or from a non-private peer need
#                `Authorization: Bearer <token>` (401 otherwise)
#   "all"      - every endpoint except /health needs a token
# Accepted tokens: the environment token below (if set) and tokens generated on the admin
# page (stored hashed in tokens.json next to library_db, mode 0600).
# auth_mode = "external"

# Trust private socket peers for token-free LAN access and the password-free admin
# page. Set false behind Docker Desktop/rootless containers, NAT with SNAT or a proxy
# that hides client addresses; use auth_mode="all" there. This disables /admin,
# including on loopback, and cannot be overridden by saved admin settings.
# trust_lan_peers = true
# Requests without a valid token must use an IP/LAN Host or a configured public_url /
# lan_url hostname. Unlisted public DNS hosts receive 403 HOST_FORBIDDEN.

# Library management (doc/api/README.md §6.9): who may start/pause/resume/cancel scans and
# remove records (POST /audio/remove) or folders (DELETE /folders/{id}). Removal only
# makes the library forget records, never touches audio files. The admin page can
# override it. Metadata writes, play counts and all reads are never affected.
#   "all" - every authorized request (including external tokens; opt in deliberately)
#   "lan" - default: only LAN-direct requests (external ones get 403 MANAGE_FORBIDDEN)
#   "off" - nobody (403 MANAGE_FORBIDDEN); use the server's CLI instead
# manage_mode = "lan"

# Name of the environment variable holding the bearer token (>= 32 visible ASCII chars).
# Use at least 32 random characters or an admin-generated al_ token, never a passphrase.
# Required with auth = true, optional otherwise. Never stored in this file, never logged.
token_env = "AUDIOLIB_SERVER_TOKEN"

# Public base URL for clients outside the LAN (behind a reverse proxy; may carry a path
# prefix), reported as `public_url` by /health. Usually set on the admin page instead.
# public_url = "https://audiolib.example.com:8443"

# Optional native TLS listener next to the HTTP port (all three or none; PEM files; the
# client only trusts public-CA certificates). Usually a reverse proxy provides HTTPS; the
# admin page can set, change or disable this without a restart.
# tls_cert_path = "/path/to/fullchain.pem"
# tls_key_path = "/path/to/privkey.pem"
# tls_port = 8791

# Maximum concurrent GET /audio/{id}/stream responses (1..=1024, default 16). Further
# stream requests get 503 BUSY with Retry-After: 1 until a body finishes.
# max_streams = 16

# Seconds between background library change checks (PRAGMA data_version + file size/mtime).
revision_poll_secs = 3

# Optional directory for GET /library/snapshot files (default: beside library_db in snapshots/).
# Sent representations are retained in this process for 24 idle hours, within 4 entries /
# 64 GiB; active transfers are protected. Restarting the server invalidates snapshot ids.
# This retained-payload budget excludes current preparation and compression staging files.
# snapshot_dir = "/var/lib/audiolib/tmp"
# A snapshot that must first be prepared (a million-file library: 30-60 s) is waited for
# at most snapshot_wait_secs (1..=3600, default 90; keep it below client/proxy header
# timeouts), then GET /library/snapshot answers 503 BUSY with Retry-After while the
# preparation continues in the background; the retry gets the finished snapshot.
# snapshot_wait_secs = 90

# Root directories (often a NAS whose disk sleeps) are checked in the background only:
# one realpath + stat of each root directory (no listing, no file reads) at startup, every
# root_check_secs (60..=86400, default 300) and when a stream finds the root offline.
# /roots reports the cached result. A check that has not answered for root_offline_secs
# (10..=3600, default 120) marks the root offline; shorter waits count as a waking disk.
# root_check_secs = 300
# root_offline_secs = 120

# GET /audio/{id}/waveform results are cached in waveform_cache_dir (default: a
# "waveforms" directory next to library_db), limited to waveform_cache_mb MiB
# (16..=1048576, default 1024; least recently used entries go first). At most
# max_waveforms (1..=64, default 4) waveform requests open/decode at once; more wait.
# waveform_cache_dir = "waveforms"
# waveform_cache_mb = 1024
# max_waveforms = 4

# List thumbnail waveforms (POST /waveforms, doc/api/README.md §9.1-§9.2) live in
# waveform_cache_dir/list/ with their own limit list_waveform_cache_mb (16..=1048576,
# default 640 MiB; not part of waveform_cache_mb). Misses are computed in the background
# by list_waveform_workers workers (1..=64, default 3, never more than max_waveforms - 1)
# that share the max_waveforms slots. pregenerate_list_waveforms = true fills the whole
# library at most list_waveform_rate files per second (1..=1000, default 10), yielding to
# scans and audio streams; the admin page and PATCH /api/v1/settings can override it.
# pregenerate_list_waveforms = false
# list_waveform_cache_mb = 640
# list_waveform_workers = 3
# list_waveform_rate = 10
# true: POST /waveforms reads no file metadata (in the request or in the background) during
# the 3 s prebuffer window after a stream or preview starts; ids it would read answer
# pending with a retry_after covering the window. Default false.
# list_waveform_pause_stats_on_playback = false

# GET /audio/{id}/preview (doc/api/README.md §8.1). Previews of both codecs have their own
# max_previews slots (1..=1024, default 8; then 503 BUSY with Retry-After: 1), separate
# from max_streams, so /stream downloads filling up never block previews. codec=pcm (WAV,
# in-process) needs nothing else. codec=flac runs ffmpeg_path (absolute; default
# Homebrew's /opt/homebrew/bin/ffmpeg); when it is missing the server still starts and
# only codec=flac answers 503 TRANSCODER_UNAVAILABLE. At most max_transcodes (1..=64,
# default 4) ffmpeg processes run at once; a further codec=flac request waits up to 0.5 s
# for a slot, then gets 503 BUSY with Retry-After: 1.
# max_previews = 8
# ffmpeg_path = "/usr/bin/ffmpeg"        # Linux; Homebrew on Apple silicon: /opt/homebrew/bin/ffmpeg
# Windows: ffmpeg_path = 'C:\Tools\ffmpeg\bin\ffmpeg.exe' (install separately; absolute path).
# max_transcodes = 4

# server_path should be the real path (no symlinks), as stored by the scanner.
# Roots can also be added and removed on the admin page (/admin -> 库根目录); once changed
# there, the list in admin-settings.json replaces the [[roots]] below.
[[roots]]
name = "SFX_Main"
server_path = "/srv/audiolib/music/SFX_Main"
webdav_url = "http://nas.example.lan:8080/SFX_Main"

[[roots]]
name = "Field_Recordings"
server_path = "/srv/audiolib/music/Field_Recordings"
# webdav_url is optional; it is reported as null when absent.
